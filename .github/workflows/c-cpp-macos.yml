name: C/C++ CI (macOS 26)

on:
  push:
    branches: [ "main", "${NUMBER}-*" ]
  pull_request:
    branches: [ "main", "${NUMBER}-*" ]

permissions:
  contents: read

jobs:
  build-against-installed-gempba:
    runs-on: ${{ fromJSON(vars.RUNNER_MACOS || '["macos-26"]') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      # Serial: concurrent legs race on the shared Homebrew install on the
      # self-hosted macOS runner.
      max-parallel: 1
      matrix:
        multiprocessing: [ON, OFF]
    env:
      GEMPBA_OWNER: ${{ vars.GEMPBA_OWNER || github.repository_owner }}
      GEMPBA_INSTALL_PREFIX: ${{ github.workspace }}/.gempba-install
      GEMPBA_CROSS_REPO_TOKEN: ${{ secrets.GEMPBA_CROSS_REPO_TOKEN || '' }}

    steps:
      # 1️⃣ Checkout this repo
      - name: Checkout gempba-examples
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 1️⃣b Bootstrap Homebrew on PATH (self-hosted runners don't source the user
      # profile in non-interactive shells, so brew may exist on disk but not on PATH).
      - name: Bootstrap Homebrew on PATH
        run: |
          if [ -x /opt/homebrew/bin/brew ]; then
            BREW_PREFIX=/opt/homebrew
          elif [ -x /usr/local/bin/brew ]; then
            BREW_PREFIX=/usr/local
          else
            echo "Homebrew not found at /opt/homebrew or /usr/local. Install it on the runner first." >&2
            exit 1
          fi
          echo "$BREW_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$BREW_PREFIX/sbin" >> "$GITHUB_PATH"
          eval "$($BREW_PREFIX/bin/brew shellenv)"
          brew --version

      # 2️⃣ Install dependencies; MPI only for MP=ON
      - name: Setup Dependencies
        run: |
          brew update
          brew install cmake pkg-config boost spdlog fmt hwloc libomp
          if [ "${{ matrix.multiprocessing }}" = "ON" ]; then
            brew install open-mpi
          fi

      # 3️⃣ Resolve sister-repo branch (same-name, fall back to main)
      - name: Resolve gempba ref
        id: gempba_ref
        run: |
          # Override any extraheader/credential helper set by actions/checkout
          # (v6 writes the GITHUB_TOKEN auth header to a separate config file
          # that --local --unset-all cannot reach, so the URL-embedded PAT was
          # being shadowed). -c clears them for THIS command only.
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            GEMPBA_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_OWNER}/gempba.git"
          else
            GEMPBA_URL="https://github.com/${GEMPBA_OWNER}/gempba.git"
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          set +e
          LS_OUTPUT=$(git -c http."https://github.com/".extraheader= -c credential.helper= ls-remote --exit-code --heads "$GEMPBA_URL" "$BRANCH" 2>&1)
          LS_EXIT=$?
          set -e
          if [ "$LS_EXIT" = "0" ]; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Picked sister branch '$BRANCH' from $GEMPBA_OWNER/gempba"
          elif [ "$LS_EXIT" = "2" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Sister branch '$BRANCH' not present in $GEMPBA_OWNER/gempba; falling back to main"
          else
            echo "::error::ls-remote against $GEMPBA_OWNER/gempba failed (exit $LS_EXIT)"
            echo "$LS_OUTPUT"
            exit "$LS_EXIT"
          fi

      # 4️⃣ Build and install gempba into a workspace-local prefix
      - name: Install gempba
        run: |
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            GEMPBA_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_OWNER}/gempba.git"
          else
            GEMPBA_URL="https://github.com/${GEMPBA_OWNER}/gempba.git"
          fi
          git -c http."https://github.com/".extraheader= -c credential.helper= clone --depth 1 --branch "${{ steps.gempba_ref.outputs.ref }}" \
            "$GEMPBA_URL" "$RUNNER_TEMP/gempba-src"
          cmake -S "$RUNNER_TEMP/gempba-src" -B "$RUNNER_TEMP/gempba-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_BUILD_TESTS=OFF \
            -DGEMPBA_DEV_MODE=OFF \
            -DGEMPBA_MULTIPROCESSING=${{ matrix.multiprocessing }} \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY=$(brew --prefix libomp)/lib/libomp.dylib \
            -DCMAKE_PREFIX_PATH=$(brew --prefix boost)
          cmake --build "$RUNNER_TEMP/gempba-build" --parallel $(sysctl -n hw.logicalcpu)
          cmake --install "$RUNNER_TEMP/gempba-build"

      # 5️⃣ Configure and build the example tree against the installed gempba
      - name: Build gempba-examples
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GEMPBA_INSTALL_PREFIX;$(brew --prefix boost)" \
            -DGEMPBA_MULTIPROCESSING=${{ matrix.multiprocessing }} \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY=$(brew --prefix libomp)/lib/libomp.dylib
          cmake --build build --parallel $(sysctl -n hw.logicalcpu)
