name: C/C++ CI (Ubuntu 24.04)

on:
  push:
    branches: [ "main", "${NUMBER}-*" ]
  pull_request:
    branches: [ "main", "${NUMBER}-*" ]

permissions:
  contents: read

jobs:
  build-against-installed-gempba:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        multiprocessing: [ON, OFF]
    env:
      CC: gcc-14
      CXX: g++-14
      GEMPBA_OWNER: ${{ vars.GEMPBA_OWNER || github.repository_owner }}
      GEMPBA_INSTALL_PREFIX: ${{ github.workspace }}/.gempba-install
      GEMPBA_CROSS_REPO_TOKEN: ${{ secrets.GEMPBA_CROSS_REPO_TOKEN || '' }}

    steps:
      # 1️⃣ Checkout this repo
      - name: Checkout gempba-examples
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # 2️⃣ Install dependencies; MPI only for MP=ON
      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-14 g++-14 make
          sudo apt-get install -y libboost-all-dev libspdlog-dev libfmt-dev libhwloc-dev pkg-config
          if [ "${{ matrix.multiprocessing }}" = "ON" ]; then
            sudo apt-get install -y libopenmpi-dev
          fi

      # 3️⃣ Resolve sister-repo branch (same-name, fall back to main)
      - name: Resolve gempba ref
        id: gempba_ref
        run: |
          # Override any extraheader/credential helper set by actions/checkout
          # (v6 writes the GITHUB_TOKEN auth header to a separate config file
          # that --local --unset-all cannot reach, so the URL-embedded PAT was
          # being shadowed). -c clears them for THIS command only.
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            GEMPBA_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_OWNER}/gempba.git"
          else
            GEMPBA_URL="https://github.com/${GEMPBA_OWNER}/gempba.git"
          fi
          BRANCH="${{ github.head_ref || github.ref_name }}"
          set +e
          LS_OUTPUT=$(git -c http."https://github.com/".extraheader= -c credential.helper= ls-remote --exit-code --heads "$GEMPBA_URL" "$BRANCH" 2>&1)
          LS_EXIT=$?
          set -e
          if [ "$LS_EXIT" = "0" ]; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "Picked sister branch '$BRANCH' from $GEMPBA_OWNER/gempba"
          elif [ "$LS_EXIT" = "2" ]; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Sister branch '$BRANCH' not present in $GEMPBA_OWNER/gempba; falling back to main"
          else
            echo "::error::ls-remote against $GEMPBA_OWNER/gempba failed (exit $LS_EXIT)"
            echo "$LS_OUTPUT"
            exit "$LS_EXIT"
          fi

      # 4️⃣ Clone gempba once; we'll configure two separate build dirs against it.
      - name: Clone gempba
        run: |
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            GEMPBA_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_OWNER}/gempba.git"
          else
            GEMPBA_URL="https://github.com/${GEMPBA_OWNER}/gempba.git"
          fi
          git -c http."https://github.com/".extraheader= -c credential.helper= clone --depth 1 --branch "${{ steps.gempba_ref.outputs.ref }}" \
            "$GEMPBA_URL" "$RUNNER_TEMP/gempba-src"

      # 4️⃣bis Install gempba mt (the base package). The mpi topping package
      #       depends on the mt base for headers and the gempbaConfig.cmake
      #       dispatcher, so the mt install always happens first — even on
      #       the MP=ON matrix leg.
      - name: Install gempba (mt base)
        run: |
          cmake -S "$RUNNER_TEMP/gempba-src" -B "$RUNNER_TEMP/gempba-build-mt" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_BUILD_TESTS=OFF \
            -DGEMPBA_DEV_MODE=OFF \
            -DGEMPBA_MULTIPROCESSING=OFF
          cmake --build "$RUNNER_TEMP/gempba-build-mt" --parallel $(nproc)
          cmake --install "$RUNNER_TEMP/gempba-build-mt"

      # 4️⃣ter Layer the mpi topping on top of the mt base when the matrix
      #       leg is MP=ON. Adds libgempba_mpi.a + gempba_mpi-targets.cmake
      #       so find_package(gempba COMPONENTS mpi) resolves.
      - name: Install gempba (mpi topping)
        if: matrix.multiprocessing == 'ON'
        run: |
          cmake -S "$RUNNER_TEMP/gempba-src" -B "$RUNNER_TEMP/gempba-build-mpi" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_BUILD_TESTS=OFF \
            -DGEMPBA_DEV_MODE=OFF \
            -DGEMPBA_MULTIPROCESSING=ON
          cmake --build "$RUNNER_TEMP/gempba-build-mpi" --parallel $(nproc)
          cmake --install "$RUNNER_TEMP/gempba-build-mpi"

      # 5️⃣ Configure and build the example tree against the installed gempba
      - name: Build gempba-examples
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_MULTIPROCESSING=${{ matrix.multiprocessing }}
          cmake --build build --parallel $(nproc)
